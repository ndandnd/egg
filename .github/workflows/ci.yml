# CBC-only CI test gate for the egg project.
#
# SCOPE NOTE: This workflow verifies SOLVER-INDEPENDENT / CBC behavior only.
# It runs the pytest suite under the default python-mip CBC backend and does
# NOT verify Gurobi performance or cluster-evidence equivalence, which remain
# governed by EGGLAB_REQUIRE_GRB on Unicorn. Its sole purpose is to make each
# PR's test count and runtime mechanically verifiable by CI rather than
# agent-self-reported.
name: CI (CBC-only test gate)

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: this gate never writes to the repository.
permissions:
  contents: read

# Cancel superseded runs for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (full history for the merge-base diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies (CBC backend; no gurobipy)
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Whitespace / conflict-marker check (git diff --check over merge-base)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if git rev-parse --verify --quiet "${base}^{commit}" >/dev/null 2>&1; then
            mb="$(git merge-base "${base}" HEAD || echo "${base}")"
            echo "git diff --check ${mb}..HEAD"
            git diff --check "${mb}" HEAD
          else
            echo "base commit unavailable (${base}); checking HEAD commit"
            git show --check HEAD
          fi

      - name: Shell syntax (bash -n) for src/cluster
        run: |
          shopt -s nullglob
          status=0
          for f in src/cluster/*.sh src/cluster/*.sub src/cluster/*.sbatch; do
            echo "bash -n ${f}"
            bash -n "${f}" || status=1
          done
          exit ${status}

      - name: Run the complete test suite (pytest, CBC)
        working-directory: src
        run: python -m pytest tests/ -q

      - name: Reconstruct frozen journal evidence (no optimizer)
        run: |
          audit_dir="$(mktemp -d)"
          python result/cyclic_robustness/20260927-attempt1/review/independent_robustness_audit.py \
            --repo . --result result/cyclic_robustness/20260927-attempt1/results.json \
            --report "${audit_dir}/robustness.json"
          python result/cyclic_replication/20260927-attempt1/review/audit_cyclic_replication.py \
            --repository . --result result/cyclic_replication/20260927-attempt1/results.json \
            --out "${audit_dir}/replication.json"
          # Checks the archived 12/15 result, including its three failures.
          # A successful audit does not reclassify that qualification as passing.
          python result/native_recharge/20260927-attempt1/review/audit_native_attempt1.py \
            --repository . --attempt result/native_recharge/20260927-attempt1 \
            --out "${audit_dir}/native-attempt1.json"
          python result/native_recharge/20260927-attempt2/review/audit_native_attempt2.py \
            --repository . --attempt result/native_recharge/20260927-attempt2 \
            --out "${audit_dir}/native-attempt2.json"
          python result/native_halfminute/20260927-attempt1/review/audit_native_halfminute.py \
            --repository . --attempt result/native_halfminute/20260927-attempt1 \
            --out "${audit_dir}/halfminute.json"
          python result/native_pathflow/20260927-attempt1/review/audit_native_pathflow.py \
            --repository . --attempt result/native_pathflow/20260927-attempt1 \
            --out "${audit_dir}/pathflow.json"
          python result/native_hull/20260927-attempt2/review/audit_native_hull_v2.py \
            --repository . --attempt result/native_hull/20260927-attempt2 \
            --out "${audit_dir}/hull-v2.json"
